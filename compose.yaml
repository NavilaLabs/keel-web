# keel-web itself runs on the host, beside the Claude Code it drives (ADR 0009).
# What is left here is a reproducible place to run the test suite, with no
# Claude login, no published ports and no access to any repository but this one.
services:
  test:
    build: docker
    command: npm test
    user: node
    working_dir: /workspaces/keel-web
    volumes:
      - .:/workspaces/keel-web
      - root_node_modules:/workspaces/keel-web/node_modules
      - client_node_modules:/workspaces/keel-web/client/node_modules
      - server_node_modules:/workspaces/keel-web/server/node_modules

volumes:
  root_node_modules:
  client_node_modules:
  server_node_modules:
